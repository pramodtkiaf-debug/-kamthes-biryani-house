<style>
  :root{
    --bg:#1c1a19;
    --bg-soft:#262220;
    --bg-softer:#2f2a27;
    --cream:#f6efe4;
    --cream-dim:#c9beae;
    --maroon:#8a1c1a;
    --maroon-dark:#651310;
    --gold:#c8934f;
    --gold-dim:#8a6a3f;
    --brown:#2e1c14;
    --ring:rgba(200,147,79,0.35);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    height:100%;
    margin:0;
    padding:0;
    background:var(--bg);
    overscroll-behavior:none;
  }

  body{
    font-family:'Outfit',sans-serif;
    color:var(--cream);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    min-height:100dvh;
    height:100dvh;
    overflow:hidden;
    padding:clamp(14px,4vh,28px) clamp(18px,6vw,32px);
    background:
      radial-gradient(ellipse at 50% 0%, rgba(200,147,79,0.10), transparent 55%),
      linear-gradient(180deg,#201d1c 0%, #1c1a19 55%, #17150f 100%);
    position:relative;
  }

  /* faint vignette texture like the matte signboard panel */
  body::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.35), transparent 60%);
    pointer-events:none;
  }

  .top{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }

  .logo-wrap{
    position:relative;
    width:clamp(66px,16vh,100px);
    height:clamp(66px,16vh,100px);
    margin-bottom:clamp(8px,1.8vh,14px);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    animation:riseIn 0.7s ease-out 0.05s forwards;
  }

  .brand-name{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:clamp(6px,1.4vh,10px);
    opacity:0;
    animation:riseIn 0.7s ease-out 0.12s forwards;
  }
  .brand-name .primary{
    font-family:'Playfair Display',serif;
    font-weight:800;
    font-style:italic;
    font-size:clamp(24px,7vw,34px);
    line-height:1.05;
    color:var(--cream);
    letter-spacing:0.2px;
  }
  .brand-name .secondary{
    font-family:'Playfair Display',serif;
    font-weight:600;
    font-size:clamp(12px,3.4vw,15px);
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--gold);
    margin-top:2px;
  }

  .logo-glow{
    position:absolute;
    inset:-30%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(200,147,79,0.35) 0%, rgba(200,147,79,0.12) 45%, transparent 72%);
    filter:blur(6px);
    animation:glowPulse 3.6s ease-in-out infinite;
  }

  .logo-ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1px solid var(--ring);
  }

  .logo-wrap img{
    position:relative;
    width:88%;
    height:88%;
    border-radius:50%;
    object-fit:cover;
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
  }

  h1{
    font-family:'Outfit',sans-serif;
    font-weight:600;
    font-size:clamp(16px,4.6vw,20px);
    line-height:1.3;
    text-align:center;
    margin:0 0 clamp(8px,1.6vh,12px) 0;
    color:var(--cream-dim);
    letter-spacing:0.2px;
    opacity:0;
    animation:riseIn 0.7s ease-out 0.18s forwards;
  }

  .flourish{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--gold);
    opacity:0;
    animation:riseIn 0.7s ease-out 0.28s forwards;
    margin-bottom:clamp(10px,2vh,16px);
  }
  .flourish span.line{ width:26px; height:1px; background:linear-gradient(90deg, transparent, var(--gold)); }
  .flourish span.line.r{ background:linear-gradient(90deg, var(--gold), transparent); }
  .flourish span.dot{ font-size:11px; transform:rotate(45deg); color:var(--gold); }

  .subtext{
    font-family:'Outfit',sans-serif;
    font-weight:400;
    font-size:clamp(13.5px,3.6vw,15.5px);
    line-height:1.5;
    text-align:center;
    color:var(--cream-dim);
    max-width:34ch;
    margin:0;
    opacity:0;
    animation:riseIn 0.7s ease-out 0.36s forwards;
  }

  .buttons{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    gap:clamp(10px,2vh,14px);
    margin:clamp(16px,3.4vh,26px) 0;
  }

  .btn{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    min-height:54px;
    padding:14px 18px;
    border-radius:16px;
    font-family:'Outfit',sans-serif;
    font-weight:600;
    font-size:clamp(14.5px,3.9vw,16.5px);
    text-decoration:none;
    border:1px solid transparent;
    cursor:pointer;
    transition:transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
    opacity:0;
    animation:riseIn 0.6s ease-out forwards;
  }
  .btn:nth-of-type(1){ animation-delay:0.46s; }
  .btn:nth-of-type(2){ animation-delay:0.54s; }
  .btn:nth-of-type(3){ animation-delay:0.62s; }

  .btn:active{ transform:scale(0.965); }

  .btn-icon{ font-size:1.2em; line-height:1; }

  .btn-google{
    background:linear-gradient(180deg,#9c2320,var(--maroon) 60%,var(--maroon-dark));
    color:var(--cream);
    box-shadow:0 6px 16px rgba(138,28,26,0.38), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .btn-google:active{ box-shadow:0 3px 10px rgba(138,28,26,0.3), inset 0 1px 0 rgba(255,255,255,0.08); }

  .btn-instagram{
    background:var(--cream);
    color:var(--brown);
    box-shadow:0 6px 16px rgba(0,0,0,0.28);
  }
  .btn-instagram:active{ box-shadow:0 3px 10px rgba(0,0,0,0.22); }

  .btn-whatsapp{
    background:rgba(200,147,79,0.08);
    color:var(--gold);
    border:1px solid var(--gold-dim);
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .btn-whatsapp:active{ background:rgba(200,147,79,0.16); }

  .btn:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:3px;
  }

  footer{
    width:100%;
    text-align:center;
    opacity:0;
    animation:riseIn 0.7s ease-out 0.7s forwards;
  }

  footer p{
    margin:0;
    font-family:'Outfit',sans-serif;
    font-size:clamp(10.5px,2.9vw,12px);
    letter-spacing:0.4px;
    color:var(--gold-dim);
    line-height:1.5;
  }

  .estd{
    display:block;
    margin-top:4px;
    font-size:9.5px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:#6b6259;
  }

  @keyframes riseIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @keyframes glowPulse{
    0%,100%{ opacity:0.55; transform:scale(1); }
    50%{ opacity:0.9; transform:scale(1.08); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
    .logo-glow{ animation:none; opacity:0.7; }
  }

  @media (max-height:640px){
    .subtext{ font-size:13px; }
    .logo-wrap{ width:60px; height:60px; margin-bottom:6px; }
    .brand-name .primary{ font-size:22px; }
  }
</style>
</head>
<body>

  <div class="top">
    <div class="logo-wrap">
